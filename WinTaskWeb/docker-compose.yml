services:
  postgres:
    image: postgres:15-alpine
    container_name: wintask_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: wintask_password
      POSTGRES_DB: wintask_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: wintask_mq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  pgdata:
